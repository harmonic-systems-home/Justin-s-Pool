name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the deploy job to publish to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that's mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Privacy guard: this site is public, so refuse to publish if any photo
      # carries GPS/location metadata. Backstop to the local pre-commit hook.
      - name: Verify photos carry no location metadata
        run: |
          sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
          if compgen -G "photos/*" > /dev/null; then
            if exiftool -gps:all -a -s photos/* | grep -qi gps; then
              echo "::error::A photo in photos/ contains GPS metadata — refusing to publish."
              exit 1
            fi
            echo "photos/ clean (no GPS)."
          else
            echo "no photos/ directory — skipping."
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Builds dist/index.html (JS/CSS inlined) and copies photos/ → dist/photos/
      # via the copy-photos vite plugin, so the Photos tab loads them at runtime.
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
