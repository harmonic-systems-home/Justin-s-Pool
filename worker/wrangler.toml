name = "justins-pool-data"
main = "worker.js"
compatibility_date = "2026-01-01"

# Non-secret config. Point ALLOW_ORIGIN at the Pages site exactly (no trailing slash).
[vars]
OWNER = "harmonic-systems-home"
REPO = "Justin-s-Pool-data"
FILE_PATH = "results.json"
ALLOW_ORIGIN = "https://harmonic-systems-home.github.io"

# Secrets are NOT stored here. Set them once after `wrangler deploy`:
#   wrangler secret put GH_TOKEN         # fine-grained PAT, Contents R/W, PRIVATE data repo only
#   wrangler secret put POOL_PASSPHRASE  # the "pool password" Justin types once per device
